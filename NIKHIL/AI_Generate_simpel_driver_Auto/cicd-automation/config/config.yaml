# CI/CD Pipeline Configuration

# Pipeline Settings
pipeline:
  name: "AI-Powered CI/CD Pipeline"
  version: "1.0.0"
  schedule: "0 */12 * * *"  # Every 12 hours
  
# Test Configuration
testing:
  framework: pytest
  test_dir: tests
  output_file: output/result.txt
  timeout: 300  # seconds
  coverage_threshold: 80
  fail_on_warning: true

# AI Configuration
ai:
  provider: openai
  model: gpt-4-turbo-preview
  temperature: 0.7
  max_tokens: 2000
  timeout: 30
  analyze_depth: detailed
  features:
    - failure_analysis
    - root_cause_detection
    - code_fix_generation
    - improvement_suggestions

# Git Configuration
git:
  user_name: "AI Bot"
  user_email: "ai-bot@github.com"
  auto_commit: true
  auto_push: true
  branch_strategy: "ai-updates"
  create_pr: true
  pr_base_branch: "main"

# Output Configuration
output:
  analysis_file: output/analysis.json
  fixes_file: output/fix.txt
  log_dir: logs
  artifact_retention_days: 30

# Notification Settings
notifications:
  on_success: true
  on_failure: true
  on_ai_changes: true
  channels:
    - github_workflow
    - email  # optional

# Security Settings
security:
  use_secrets: true
  mask_api_keys: true
  validate_changes: true
  sandbox_execution: true

# Advanced Settings
advanced:
  parallel_analysis: true
  cache_analysis: false
  debug_mode: false
  verbose_logging: true
