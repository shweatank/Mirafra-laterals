name: AI-Powered CI/CD Pipeline

on:
  # Run every 12 hours
  schedule:
    - cron: '0 */12 * * *'
  
  # Manual trigger from GitHub UI
  workflow_dispatch:
  
  # Optional: Run on push to development branches
  push:
    branches:
      - develop
      - main

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "Dependencies installed successfully"

      # Step 4: Run tests and capture output
      - name: Run Test Suite
        id: test_run
        continue-on-error: true
        run: |
          mkdir -p output logs
          python -m pytest tests/ -v --tb=short > output/result.txt 2>&1 || true
          echo "test_exit_code=$?" >> $GITHUB_OUTPUT
          echo "Tests completed (output saved to result.txt)"

      # Step 5: Run AI analysis and fix generation
      - name: AI Analysis and Code Fix
        id: ai_analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          python scripts/ai_integration.py \
            --result-file output/result.txt \
            --output-dir output \
            --log-file logs/ai_analysis.log \
            --source-dir src \
            --dry-run false

      # Step 6: Check if changes were made by AI
      - name: Check for Changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      # Step 7: Configure Git user for commits
      - name: Configure Git
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "ai-bot@github.com"
          git config --local user.name "AI Bot"
          git config --local user.signingkey ""

      # Step 8: Create AI updates branch
      - name: Create AI Updates Branch
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git checkout -b ai-updates-${{ github.run_id }} || git checkout ai-updates-${{ github.run_id }}
          echo "Branch created/switched successfully"

      # Step 9: Stage and commit changes
      - name: Commit AI Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git add -A
          git commit -m "chore: AI-generated fixes and improvements

          - Analyzed test failures from CI/CD pipeline
          - Generated fixes and code improvements
          - Updated source files accordingly
          - Run ID: ${{ github.run_id }}
          - Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # Step 10: Push changes to AI updates branch
      - name: Push Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git push origin ai-updates-${{ github.run_id }} -f
          echo "Changes pushed to ai-updates-${{ github.run_id }} branch"

      # Step 11: Create Pull Request (optional)
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `AI Updates - Run ${{ github.run_id }}`,
                head: `ai-updates-${{ github.run_id }}`,
                base: 'main',
                body: `## AI-Generated Updates\n\n- **Run ID**: ${{ github.run_id }}\n- **Timestamp**: ${new Date().toISOString()}\n- **Trigger**: ${context.eventName}\n\n### Changes\nGenerated by AI analysis of test results. Please review before merging.`
              });
              console.log('PR Created:', pr.data.html_url);
            } catch (error) {
              console.log('PR creation skipped or failed:', error.message);
            }

      # Step 12: Upload artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            output/result.txt
            output/fix.txt
            logs/

      # Step 13: Summary Report
      - name: Generate Summary
        if: always()
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -20 output/result.txt || echo "No test results available" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AI Analysis Output" >> $GITHUB_STEP_SUMMARY
          if [ -f output/fix.txt ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -20 output/fix.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No AI fixes generated" >> $GITHUB_STEP_SUMMARY
          fi
